name: befine_app
description: BeFine Smart Inhaler companion application.
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # BeFine BLE SDK (local monorepo package)
  befine_ble_sdk:
    path: ../../packages/befine_ble_sdk

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.0

  # Dependency injection
  get_it: ^8.0.0

  # Local database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Charts
  fl_chart: ^0.68.0

  # Functional programming
  dartz: ^0.10.1

  # Export & sharing
  share_plus: 13.1.0
  pdf: ^3.11.1
  csv: ^6.0.0

  # Settings persistence
  shared_preferences: ^2.3.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
